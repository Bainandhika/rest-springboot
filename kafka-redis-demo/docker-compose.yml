version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: baghaskara_postgres
    environment:
      POSTGRES_DB: baghaskara_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baghaskara_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: baghaskara_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@baghaskara.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # pgAdmin web UI akan accessible di http://localhost:5050
    depends_on:
      - postgres
    networks:
      - baghaskara_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  baghaskara_network:
    driver: bridge