spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/baghaskara_db
    username: postgres
    password: password
  jpa:
    hibernate:
      # WARNING: Use 'validate' or 'none' in production! 
      # 'update' is only for local dev to auto-create tables.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080