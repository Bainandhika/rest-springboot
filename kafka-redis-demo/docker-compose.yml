version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: baghaskara_postgres
    environment:
      POSTGRES_DB: baghaskara_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baghaskara_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: baghaskara_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@baghaskara.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80" # pgAdmin web UI akan accessible di http://localhost:5050
    depends_on:
      - postgres
    networks:
      - baghaskara_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: baghaskara_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # Enable persistence (AOF)
    networks:
      - baghaskara_network
    volumes:
      - redis_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: baghaskara_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - baghaskara_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: baghaskara_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" # Port untuk Spring Boot (Host machine)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PENTING: PLAINTEXT untuk akses dari luar (laptop lu), PLAINTEXT_INTERNAL untuk antar container
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - baghaskara_network

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
networks:
  baghaskara_network:
    driver: bridge
